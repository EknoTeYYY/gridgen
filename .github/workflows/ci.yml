name: CI

# typecheck em todo push/PR; build+push das 3 imagens no GHCR só em `main`.
# A VM só faz `pull` — quem publica é este workflow (ver DEPLOY.md).
#
# Sem job de teste ainda: não existe suíte automatizada no projeto (decisão
# consciente, registrada no README) — não faz sentido fingir uma aqui.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # Sem isto o botão "Run workflow" nem aparece na aba Actions — útil se um
  # push não disparar (Actions desabilitado, cota estourada) e o deploy
  # ficar sem imagem nova pra puxar.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # publicar imagens no GitHub Container Registry (GHCR)

jobs:
  typecheck:
    name: Typecheck (todos os workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # api/web/render resolvem @gridgen/shared pelo dist/ compilado, não
      # pelo src/ direto — precisa buildar antes de qualquer typecheck.
      - name: build @gridgen/shared
        run: npm run build --workspace=@gridgen/shared
      # Sem isto, o @prisma/client fica com o cliente genérico (sem os tipos
      # do schema.prisma) — típico "any" implícito em callback de query e
      # "Module has no exported member 'Conta'" no typecheck da api.
      - name: gerar Prisma Client
        # DATABASE_URL fake só pra satisfazer o `env("DATABASE_URL")` do
        # schema — `generate` nunca conecta de verdade no banco.
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
        run: npm run prisma:generate --workspace=@gridgen/api
      - run: npm run typecheck --workspaces --if-present

  # ============================================================
  # BUILD → GHCR (só em `main` e tags). A VM só PUXA — não builda.
  # Imagens: ghcr.io/<owner>/gridgen/{api,web,render}
  # ============================================================
  build-api:
    name: Build & push api → GHCR
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Nome da imagem (owner em minúsculas — exigência do GHCR)
        id: img
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.base }}:latest
            ${{ steps.img.outputs.base }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: Build & push web → GHCR
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Nome da imagem (owner em minúsculas — exigência do GHCR)
        id: img
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}/web" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.base }}:latest
            ${{ steps.img.outputs.base }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-render:
    name: Build & push render → GHCR
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Nome da imagem (owner em minúsculas — exigência do GHCR)
        id: img
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}/render" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: render/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.base }}:latest
            ${{ steps.img.outputs.base }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
